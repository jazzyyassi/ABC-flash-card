<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Phonics Flashcards</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Arial Rounded MT Bold', 'Helvetica', sans-serif;
            background-color: #FCFDF7; overflow: hidden;
            user-select: none; touch-action: manipulation;
        }

        #app {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            height: 100%;
            padding: 20px 0 10px;
        }

        #card {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .letter {
            font-size: 18vw;
            font-weight: bold;
            color: #333;
            line-height: 1;
            margin-bottom: 10px;
        }

        .photo {
            max-width: 88%;
            max-height: 62vh;
            border-radius: 18px;
            object-fit: contain;
        }

        .fade-in {
            animation: fadeIn 0.2s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to   { opacity: 1; transform: scale(1); }
        }

        #nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            padding: 10px 0 16px;
        }

        .arrow-btn {
            background: #f0f0f0;
            border: none;
            border-radius: 50%;
            width: 72px;
            height: 72px;
            font-size: 34px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, transform 0.1s;
            -webkit-tap-highlight-color: transparent;
        }
        .arrow-btn:active {
            background: #d0e8ff;
            transform: scale(0.92);
        }
    </style>
</head>
<body>

    <div id="app">
        <div id="card"></div>
        <div id="nav">
            <button class="arrow-btn" onclick="navigate(-1)">&#8592;</button>
            <button class="arrow-btn" onclick="navigate(1)">&#8594;</button>
        </div>
    </div>

    <script>
        const cards = [
            { l: "A", img: "images/ANT.JPG" },
            { l: "B", img: "images/BAT.JPG" },
            { l: "C", img: "images/CAT.JPG" },
            { l: "D", img: "images/DOG.JPG" },
            { l: "E", img: "images/EVE.JPG" },
            { l: "F", img: "images/FAN.JPG" },
            { l: "G", img: "images/GAP.JPG" },
            { l: "H", img: "images/HAT.JPG" },
            { l: "I", img: "images/ICE.JPG" },
            { l: "J", img: "images/JASPER.JPG" },
            { l: "K", img: "images/KEY.JPG" },
            { l: "L", img: "images/LIP.JPG" },
            { l: "M", img: "images/MAX.JPG" },
            { l: "N", img: "images/NO.JPG" },
            { l: "O", img: "images/OX.JPG" },
            { l: "P", img: "images/PEN.JPG" },
            { l: "Q", img: "images/QUEEN.JPG" },
            { l: "R", img: "images/RAT.JPG" },
            { l: "S", img: "images/SUN.JPG" },
            { l: "T", img: "images/TOE.JPG" },
            { l: "U", img: "images/UP.JPG" },
            { l: "V", img: "images/VAN.JPG" },
            { l: "W", img: "images/WATER.JPG" },
            { l: "X", img: "images/XRAY.JPG" },
            { l: "Y", img: "images/YES.JPG" },
            { l: "Z", img: "images/ZIP.JPG" }
        ];

        let index = 0;
        const card = document.getElementById('card');

        function render() {
            const current = cards[index];
            card.innerHTML = `
                <div class="fade-in" style="display:flex;flex-direction:column;align-items:center;">
                    <img src="${current.img}" class="photo" alt="${current.l}">
                </div>`;
        }

        function navigate(dir) {
            index = (index + dir + cards.length) % cards.length;
            render();
        }

        window.onload = render;
    </script>
</body>
</html>
